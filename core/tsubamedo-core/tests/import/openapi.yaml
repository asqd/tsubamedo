openapi: 3.0.3
info:
  title: Зоомагазин
  version: 1.0.0
servers:
  - url: https://{region}.pets.test/v1
    description: Прод
    variables:
      region:
        default: eu
  - url: http://localhost:8080/v1
    description: Локально
security:
  - bearer: []
tags:
  - name: pets
paths:
  /pets:
    get:
      tags: [pets]
      summary: Список питомцев
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [cat, dog] }
        - name: X-Request-Id
          in: header
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      tags: [pets]
      operationId: createPet
      requestBody:
        $ref: "#/components/requestBodies/Pet"
      responses:
        "201": { description: created }
        "400": { description: bad }
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [pets]
      summary: Один питомец
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    delete:
      tags: [pets]
      security: []
      parameters:
        - name: petId
          in: path
          required: true
          example: 7
      responses:
        "204": { description: gone }
  /pets/{petId}/photo:
    put:
      tags: [pets]
      security:
        - key: []
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                caption: { type: string, example: Мурзик }
                file: { type: string, format: binary }
      responses:
        default: { description: ok }
  /health:
    get:
      responses:
        "200": { description: ok }
components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema: { type: integer, example: 3 }
  requestBodies:
    Pet:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Pet"
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        id: { type: integer, readOnly: true }
        name: { type: string, example: Барсик }
        born: { type: string, format: date, nullable: true }
        weight: { type: number, minimum: 0, exclusiveMinimum: true }
        tags:
          type: array
          items: { type: string }
        owner:
          $ref: "#/components/schemas/Owner"
        parent:
          $ref: "#/components/schemas/Pet"
    Owner:
      allOf:
        - type: object
          properties:
            email: { type: string, format: email }
        - type: object
          properties:
            vip: { type: boolean }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    key:
      type: apiKey
      in: header
      name: X-Api-Key
